[project]
name = "ai-command-center"
version = "0.1.0"
description = "LINE-based personal AI operations command center"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "openai>=1.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]